<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGUS GRID // World Intelligence</title>
  
  <link rel="stylesheet" href="[https://unpkg.com/leaflet@1.9.4/dist/leaflet.css](https://unpkg.com/leaflet@1.9.4/dist/leaflet.css)" />
  <script src="[https://unpkg.com/force-graph](https://unpkg.com/force-graph)"></script>

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151d30;
      --border-color: #23314d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-gold: #eab308;
      --accent-purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 15px;
    }

    /* RESPONSIVER CONTAINER (OPTIMAL FÜR MONITORE & HANDYS) */
    .app-container {
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      gap: 10px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 1px;
    }

    .view-toggle {
      display: flex;
      gap: 5px;
      background: #0f172a;
      padding: 4px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .toggle-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: var(--accent-cyan);
      color: #000000;
    }

    /* VISIBILITY CONTROLS */
    body.simple-mode .detailed-section { display: none !important; }
    body:not(.simple-mode) .simple-only-section { display: none !important; }

    /* AMPEL WIDGET */
    .ampel-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ampel-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #070a12;
      padding: 12px 10px;
      border-radius: 30px;
      border: 1px solid #1e293b;
    }

    .ampel-light {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      opacity: 0.15;
    }

    .ampel-light.green.active { background: var(--accent-green); opacity: 1; box-shadow: 0 0 15px var(--accent-green); }
    .ampel-light.yellow.active { background: var(--accent-gold); opacity: 1; box-shadow: 0 0 15px var(--accent-gold); }
    .ampel-light.red.active { background: var(--accent-red); opacity: 1; box-shadow: 0 0 15px var(--accent-red); }

    /* FLÜSSIGES GRID SYSTEM */
    .main-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .full-width { grid-column: 1 / -1; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--accent-cyan);
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 6px;
    }

    /* KARTEN & DIAGRAMME CONTAINER */
    #hotspot-map, #knowledge-graph {
      height: 450px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #070a12;
    }

    .takeaways-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
    }

    .takeaway-card {
      background: #0f172a;
      border-left: 4px solid var(--accent-cyan);
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    /* RESPONSIVE MAPPING FÜR MOBILGERÄTE */
    @media (max-width: 768px) {
      body { padding: 10px; }
      .ampel-card { flex-direction: column; text-align: center; }
      .ampel-box { flex-direction: row; }
      #hotspot-map, #knowledge-graph { height: 320px; }
    }
  </style>
</head>
<body class="simple-mode">

  <div class="app-container">
    <header>
      <div>
        <div class="brand-title">🌐 ARGUS GRID</div>
        <div id="last-update" style="font-size: 0.8rem; color: var(--text-muted);">Stand: Wird geladen...</div>
      </div>
      
      <div class="view-toggle">
        <button id="btn-simple" class="toggle-btn active" onclick="setMode('simple')">⚡ Standard</button>
        <button id="btn-detailed" class="toggle-btn" onclick="setMode('detailed')">🔬 Tiefenanalyse</button>
      </div>
    </header>

    <!-- AMPEL ANSICHT -->
    <div class="ampel-card">
      <div class="ampel-box">
        <div id="ampel-red" class="ampel-light red"></div>
        <div id="ampel-yellow" class="ampel-light yellow"></div>
        <div id="ampel-green" class="ampel-light green"></div>
      </div>
      <div>
        <h3 id="ampel-title" style="font-size: 1.3rem; margin-bottom: 5px;">Weltlage wird ermittelt...</h3>
        <p id="ampel-reason" style="color: #cbd5e1;">Lade Informationen...</p>
      </div>
    </div>

    <!-- STANDARD ANSICHT (EINFACHE SPRACHE) -->
    <div class="simple-only-section">
      <div class="card" style="margin-bottom: 20px;">
        <h2>💬 Das Wichtigste auf einen Blick</h2>
        <p id="simple-summary" style="font-size: 1.05rem; line-height: 1.6; margin-bottom: 15px;"></p>
        <div id="takeaways-container" class="takeaways-grid"></div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <h2>🔮 Zukunfts-Prognose (Nächste 30–90 Tage)</h2>
        <p id="forecast-text" style="font-size: 1rem; line-height: 1.5;"></p>
      </div>

      <div class="card">
        <h2>📜 Historische Parallelen</h2>
        <div id="historical-container"></div>
      </div>
    </div>

    <!-- TIEFENANALYSE ANSICHT -->
    <div class="detailed-section main-grid">
      <div class="card full-width">
        <h2>📋 Executive Briefing</h2>
        <p id="exec-summary" style="line-height: 1.6;"></p>
      </div>

      <div class="card full-width">
        <h2>🕸️ Entity-Relationship Kaskaden-Netzwerk</h2>
        <div id="knowledge-graph"></div>
      </div>

      <div class="card full-width">
        <h2>🗺️ Tactical Radar Map</h2>
        <div id="hotspot-map"></div>
      </div>
    </div>
  </div>

  <script src="[https://unpkg.com/leaflet@1.9.4/dist/leaflet.js](https://unpkg.com/leaflet@1.9.4/dist/leaflet.js)"></script>

  <script>
    let map = null;
    let graphInstance = null;
    let globalData = null;

    function setMode(mode) {
      if (mode === 'simple') {
        document.body.classList.add('simple-mode');
        document.getElementById('btn-simple').classList.add('active');
        document.getElementById('btn-detailed').classList.remove('active');
      } else {
        document.body.classList.remove('simple-mode');
        document.getElementById('btn-detailed').classList.add('active');
        document.getElementById('btn-simple').classList.remove('active');
        
        // VERZÖGERTES RENDERING FÜR VISUELLE ELEMENTE IM VISIBLE DOM
        setTimeout(() => {
          if (globalData) {
            if (!map) initMap(globalData.conflict_hotspots || []);
            else map.invalidateSize();

            if (globalData.graph_network) initGraph(globalData.graph_network);
          }
        }, 200);
      }
    }

    async function loadData() {
      try {
        const res = await fetch('./data.json?t=' + new Date().getTime());
        globalData = await res.json();
        
        // AMPEL & STATUS
        const st = (globalData.ampel_status || 'GELB').toUpperCase();
        document.getElementById('ampel-yellow').classList.toggle('active', st === 'GELB');
        document.getElementById('ampel-red').classList.toggle('active', st === 'ROT');
        document.getElementById('ampel-green').classList.toggle('active', st === 'GRÜN');
        
        document.getElementById('ampel-title').innerText = "Weltlage Status: " + st;
        document.getElementById('ampel-reason').innerText = globalData.ampel_reason_simple || "";
        document.getElementById('simple-summary').innerText = globalData.daily_executive_summary_simple || "";
        document.getElementById('exec-summary').innerText = globalData.daily_executive_summary || "";
        document.getElementById('last-update').innerText = "Stand: " + (globalData.timestamp || "Aktuell");

        // TAKEAWAYS
        if (Array.isArray(globalData.simple_key_takeaways)) {
          let html = "";
          globalData.simple_key_takeaways.forEach(t => {
            html += `<div class="takeaway-card">${t}</div>`;
          });
          document.getElementById('takeaways-container').innerHTML = html;
        }

        // PROGNOSE
        if (globalData.predictive_horizon) {
          document.getElementById('forecast-text').innerText = globalData.predictive_horizon.base_case_summary || "";
        }

      } catch (e) {
        console.error("Fehler beim Laden von data.json", e);
      }
    }

    function initMap(hotspots) {
      const container = document.getElementById('hotspot-map');
      if (!container || map) return;

      map = L.map('hotspot-map').setView([30, 20], 2);
      L.tileLayer('https://{s}[.basemaps.cartocdn.com/dark_all/](https://.basemaps.cartocdn.com/dark_all/){z}/{x}/{y}{r}.png').addTo(map);

      hotspots.forEach(h => {
        if (h.lat && h.lng) {
          L.circleMarker([h.lat, h.lng], { radius: 8, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.8 })
           .addTo(map)
           .bindPopup(`<b>${h.region || 'Hotspot'}</b><br>${h.impact || ''}`);
        }
      });
    }

    function initGraph(graphData) {
      const container = document.getElementById('knowledge-graph');
      if (!container || typeof ForceGraph === 'undefined') return;

      container.innerHTML = '';
      graphInstance = ForceGraph()(container)
        .width(container.clientWidth || 800)
        .height(450)
        .graphData(graphData)
        .nodeId('id')
        .nodeLabel('label')
        .nodeColor(n => n.group === 'hotspot' ? '#ef4444' : '#38bdf8')
        .linkColor(() => '#334155')
        .backgroundColor('#070a12');
    }

    document.addEventListener("DOMContentLoaded", loadData);
  </script>
</body>
</html>
